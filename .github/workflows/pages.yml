# Deploys the site to GitHub Pages on every push to main.
# `enablement: true` lets this workflow switch Pages back on by itself if it
# was disabled (e.g. after a repo visibility change) — no Settings visit needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # nothing a visitor loads lives here, so a push touching only these skips the deploy
    paths-ignore:
      - 'tests/**'
      - 'scripts/**'
      - '**/*.md'
      - '.claude/**'
      - '.github/dependabot.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/transit.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      # publish only what the site serves: tests, scripts and docs stay in the repo
      - name: Stage the site
        run: |
          rsync -a --exclude '.*' --exclude _site --exclude tests --exclude scripts --exclude '*.md' ./ _site/
          test -f _site/index.html && test -f _site/sw.js && test -f _site/transit.js
          du -sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
      # a green deploy that serves the old page is still a failed deploy: wait for this BUILD
      - name: Verify the live site serves this build
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          want=$(grep -o 'const BUILD = "[^"]*"' index.html)
          for i in $(seq 1 20); do
            if curl -fsS "${URL}?v=${GITHUB_SHA}" | grep -qF "$want"; then echo "live: $want"; exit 0; fi
            sleep 15
          done
          echo "::error::${URL} is not serving ${want} after 5 minutes"; exit 1
